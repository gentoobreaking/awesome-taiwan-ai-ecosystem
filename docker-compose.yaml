services:
  crawler:
    image: awesome-taiwan-mcp:crawler
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awesome-taiwan-mcp-crawler
    command: ["--help"]
    volumes:
      - ./registry:/data/registry
      - ./data:/data/db
      - ./config:/app/config
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://opencode.ai/zen/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    resources:
      limits:
        cpus: "1.0"
        memory: "512M"
      reservations:
        cpus: "0.5"
        memory: "256M"
    restart: unless-stopped
