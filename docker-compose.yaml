services:
  crawler:
    image: ai-ecosystem-crawler:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ecosystem-crawler
    hostname: ai-ecosystem-crawler
    command: ["run", "--db", "/data/db/registry.db"]
    volumes:
      - ./registry:/data/registry
      - ./data:/data/db
      - ./config:/app/config
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://opencode.ai/zen/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"
    restart: unless-stopped

  api:
    image: ai-ecosystem-api:latest
    build:
      context: .
      dockerfile: Dockerfile.multi
      target: runtime-api
    container_name: ai-ecosystem-api
    hostname: ai-ecosystem-api
    ports:
      - "8003:8003"
    command: [
      "--port", "8003",
      "--db", "/data/db/registry.db",
      "--rate-limit", "100"
    ]
    volumes:
      - ./data:/data/db
      - ./registry:/data/registry
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    restart: unless-stopped

  web:
    image: ai-ecosystem-web:latest
    build:
      context: .
      dockerfile: Dockerfile.multi
      target: web
    container_name: ai-ecosystem-web
    hostname: ai-ecosystem-web
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://api:8003/api/v1
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    restart: unless-stopped
