linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gosec

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable-all: true
  gosec:
    excludes:
      - G104 # unhandled errors in audit

run:
  timeout: 5m
  tests: true

issues:
  exclude-patterns:
    - _test\.go.*gosec # ignore gosec in tests
  max-issues-per-linter: 100
  max-same-issues: 3

output:
  formats:
    - format: colored
